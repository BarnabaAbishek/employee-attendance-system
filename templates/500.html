{% extends "base.html" %}

{% block title %}Server Error - Attendance System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <div class="error-icon mb-4">
                        <i class="fas fa-server fa-5x text-danger"></i>
                    </div>
                    
                    <h1 class="display-4 fw-bold text-danger mb-3">500</h1>
                    <h2 class="h4 mb-4">Internal Server Error</h2>
                    
                    <p class="text-muted mb-4">
                        Something went wrong on our server. Please try again later.
                    </p>
                    
                    <div class="d-grid gap-3 d-md-flex justify-content-md-center">
                        <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-lg px-4">
                            <i class="fas fa-home me-2"></i>Go to Dashboard
                        </a>
                        <button onclick="location.reload()" class="btn btn-outline-warning btn-lg px-4">
                            <i class="fas fa-redo me-2"></i>Try Again
                        </button>
                    </div>
                    
                    <div class="mt-4 pt-3 border-top">
                        <p class="small text-muted">
                            If the problem persists, please contact support.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
